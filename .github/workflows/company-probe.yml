name: Company ATS Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Infosys production adapter
        run: |
          python -u - <<'PY'
          import time
          from collections import Counter

          from research.loader import load_registry
          from src.providers import InfosysAdapter

          company = next(
            c for c in load_registry().companies
            if c.id == "infosys"
          )

          started = time.perf_counter()
          jobs = InfosysAdapter().fetch_jobs(company)
          elapsed = time.perf_counter() - started
          ids = [job.id for job in jobs]

          print(
            f"[INFOSYS-VALIDATE] {company.name}: "
            f"jobs={len(jobs)} "
            f"unique={len(set(ids))} "
            f"seconds={elapsed:.2f}"
          )
          print(
            "[INFOSYS-VALIDATE] top_locations=",
            Counter(job.location for job in jobs).most_common(20),
          )

          for job in jobs:
            if any(
              city in job.location.upper()
              for city in (
                "MUMBAI",
                "BANGALORE",
                "BENGALURU",
              )
            ):
              print(
                f"[INFOSYS-MATCH] {job.id} | "
                f"{job.title} | {job.location} | {job.url}"
              )

          if not jobs:
            raise RuntimeError("Infosys returned zero jobs")

          if len(ids) != len(set(ids)):
            raise RuntimeError("Infosys returned duplicate job IDs")

          print("[INFOSYS-VALIDATE] PASSED")
          PY

      - name: Company Probe
        run: python -u -m research.company_probe

      - name: Verify IBM and HCLTech configuration
        run: |
          python - <<'PY'
          from research.loader import load_registry

          for company in load_registry().companies:
              if company.id in ("ibm", "hcltech"):
                  print(
                      "[CONFIG]",
                      company.id,
                      "enabled=", company.enabled,
                      "terms=", company.provider.config.search_terms,
                      "max_pages=", company.provider.config.max_pages,
                  )
          PY

      - name: Validate IBM and HCLTech
        run: |
          python -u - <<'PY'
          import time
          from research.loader import load_registry
          from src.providers import IBMAdapter, HCLTechAdapter

          companies = {
              c.id: c
              for c in load_registry().companies
          }

          failed = []

          for company_id, adapter in (
              ("ibm", IBMAdapter()),
              ("hcltech", HCLTechAdapter()),
          ):
              company = companies[company_id]
              started = time.perf_counter()

              try:
                  jobs = adapter.fetch_jobs(company)
                  elapsed = time.perf_counter() - started

                  unique = len({job.id for job in jobs})

                  print(
                      f"[FINAL] {company.name}: "
                      f"jobs={len(jobs)} "
                      f"unique={unique} "
                      f"seconds={elapsed:.2f}"
                  )

                  for job in jobs:
                      if any(
                          city in job.location.upper()
                          for city in (
                              "MUMBAI",
                              "BANGALORE",
                              "BENGALURU",
                          )
                      ):
                          print(
                              f"[MATCH] {company.name}: "
                              f"{job.id} | {job.title} | "
                              f"{job.location} | {job.url}"
                          )

                  if not jobs or len(jobs) != unique:
                      raise RuntimeError(
                          "Empty inventory or duplicate IDs"
                      )

                  print(f"[FINAL] {company.name}: PASSED")

              except Exception as exc:
                  failed.append(company_id)
                  print(
                      f"[FINAL] {company.name}: FAILED "
                      f"{type(exc).__name__}: {exc}"
                  )

          if failed:
              raise SystemExit(
                  "Failed providers: " + ", ".join(failed)
              )
          PY
name: Company ATS Probe

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Select research probe"
        required: true
        type: choice
        default: new-companies
        options:
          - new-companies
          - stale-recovery
          - activation-check
          - company-batch
          - integration-batch
          - enterprise-batch
          - legacy

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # - name: Run company probe
      #   run: python -u research/company_probe.py

      # - name: Run new company stage 2 probe
      #   run: python -u -m research.new_company_stage2_probe

      # - name: Validate Deloitte and Wissen SuccessFactors adapters
      #   run: python -u -m research.new_company_stage3_probe

      # - name: Validate Deloitte and Wissen pre-activation identities
      #   run: python -u -m research.new_company_stage4_probe

      - name: Run selected ATS research probe
        env:
          PROBE_MODE: ${{ inputs.probe }}
        run: |
          case "$PROBE_MODE" in
            new-companies)
              python -u -m research.company_probe --new-companies
              ;;
            stale-recovery)
              python -u -m research.company_probe --stale-recovery
              ;;
            activation-check)
              python -u -m research.company_probe --activation-check
              ;;
            company-batch)
              python -u -m research.company_probe --company-batch
              ;;
            integration-batch)
              python -u -m research.company_probe --integration-batch
              ;;
            enterprise-batch)
              python -u -m research.company_probe --enterprise-batch
              ;;
            legacy)
              python -u -m research.company_probe
              ;;
            *)
              echo "Unknown probe mode: $PROBE_MODE"
              exit 1
              ;;
          esac
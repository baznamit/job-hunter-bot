name: Job Hunter

on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: "Validate external scheduler without running the bot"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-hunter
  cancel-in-progress: false

jobs:
  external-scheduler-validation:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.validation_only == true

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Record external scheduler trigger
        run: |
          echo "External scheduler reached GitHub successfully."
          echo "Event: ${{ github.event_name }}"
          echo "Validation only: ${{ inputs.validation_only }}"
          echo "Runner started UTC: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run attempt: ${{ github.run_attempt }}"

  run:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.validation_only != true

    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Show trigger
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "UTC start: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Bot
        run: |
          python -m src.main

      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.json data/recovery.json
          git diff --staged --quiet \
            || git commit -m "chore(data): update bot state [skip ci]"
          git push